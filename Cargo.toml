[package]
name = "app"
version = "0.1.0"
edition = "2024"
description = "notpauca.github.io site"
repository = "https://github.com/notpauca/notpauca.github.io"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.91"
wasm-bindgen-futures = "0.4.73"
wgpu = "29.0.3"
cgmath = "0.18.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
image = { version = "0.25.10",features = ["jpeg", "png"] }

#removed from "normal" dependency list, as that feature list is too long
#WHY IS THIS GETTING AUTOFORMATTED WTF
[dependencies.web-sys]
version = "0.3.100"
features = ["KeyboardEvent", "Window", "Document", "console", "HtmlCanvasElement", "DomRect", "ResizeObserver", "DateTimeValue", "Request", "RequestInit", "RequestMode", "Response", "Headers", "PointerEvent", "ReadableStream"]